apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: governed-rag-ingress
  namespace: governed-rag
spec:
  ingressClassName: nginx
  rules:
    - host: rag.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-ui
                port:
                  number: 8501

    - host: api.rag.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api
                port:
                  number: 8000