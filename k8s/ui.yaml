apiVersion: v1
kind: Service
metadata:
  name: rag-ui
  namespace: governed-rag
spec:
  selector:
    app: rag-ui
  ports:
    - name: http
      port: 8501
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-ui
  namespace: governed-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-ui
  template:
    metadata:
      labels:
        app: rag-ui
    spec:
      containers:
        - name: rag-ui
          image: a91640/governed-rag:1.0.1
          imagePullPolicy: IfNotPresent
          command:
            - streamlit
          args:
            - run
            - app.py
            - --server.address=0.0.0.0
            - --server.port=8501
          ports:
            - containerPort: 8501
                      readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: rag-secrets
          env:
            - name: RAG_API_URL
              value: http://rag-api:8000
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi