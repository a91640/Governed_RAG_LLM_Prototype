services:
  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    env_file:
      - .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      QDRANT_URL: "http://qdrant:6333"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      RAG_API_KEY: "${RAG_API_KEY:?set RAG_API_KEY in .env}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-RAG_LLM_Prototype}"
      LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
    volumes:
      - "./data:/app/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 20s
      timeout: 5s
      retries: 5

  ui:
    build: .
    env_file:
      - .env
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      RAG_API_URL: "http://api:8000"
      RAG_API_KEY: "${RAG_API_KEY:?set RAG_API_KEY in .env}"
    volumes:
      - "./data:/app/data"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  qdrant_storage:
    external: true