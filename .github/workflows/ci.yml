name: CI - Test and Build Governed RAG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: a91640/governed-rag
concurrency:
  group: governed-rag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall api.py app.py agentic_rag.py rag_demo.py

      - name: Run tests
        run: |
          python -m pytest -q tests

  build-and-push:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
        
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

                 - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    name: Deploy to AKS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KUBECONFIG: /tmp/aks-kubeconfig.json
    steps:
      - name: Configure Kubernetes connection
        id: connection
        env:
          AKS_SERVER: ${{ secrets.AKS_SERVER }}
          AKS_SECRET_JSON: ${{ secrets.AKS_SERVICE_ACCOUNT_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import ssl
          import urllib.request
          from pathlib import Path

          secret = json.loads(os.environ["AKS_SECRET_JSON"])
          data = secret["data"]
          token = base64.b64decode(data["token"]).decode().strip()
          print(f"::add-mask::{token}")
          server = os.environ["AKS_SERVER"].strip().rstrip("/")

          config = {
              "apiVersion": "v1",
              "kind": "Config",
              "clusters": [{
                  "name": "aks",
                  "cluster": {
                      "server": server,
                      "certificate-authority-data": data["ca.crt"],
                  },
              }],
              "users": [{
                  "name": "github-deployer",
                  "user": {"token": token},
              }],
              "contexts": [{
                  "name": "aks",
                  "context": {
                      "cluster": "aks",
                      "user": "github-deployer",
                      "namespace": "governed-rag",
                  },
              }],
              "current-context": "aks",
          }

          path = Path(os.environ["KUBECONFIG"])
          path.write_text(json.dumps(config), encoding="utf-8")
          path.chmod(0o600)

          ca = base64.b64decode(data["ca.crt"]).decode()
          request = urllib.request.Request(
              server + "/version",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(
              request,
              context=ssl.create_default_context(cadata=ca),
              timeout=30,
          ) as response:
              version = json.load(response)["gitVersion"].split("+")[0]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"kubectl_version={version}\n")
          PY

      - name: Install matching kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.connection.outputs.kubectl_version }}

      - name: Deploy API and UI
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          kubectl -n governed-rag set image deployment/rag-api rag-api="$IMAGE"
          kubectl -n governed-rag rollout status deployment/rag-api --timeout=300s
          kubectl -n governed-rag set image deployment/rag-ui rag-ui="$IMAGE"
          kubectl -n governed-rag rollout status deployment/rag-ui --timeout=300s